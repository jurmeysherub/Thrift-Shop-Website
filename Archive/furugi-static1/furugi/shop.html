<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | Furugi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">
  <div id="site-header"></div>

  <main class="wrap">
    <div class="page-title">
      <h1>Shop</h1>
      <p>Prices are in ngultrum. Sizes follow the Japanese tag, so check the measurements on each piece.</p>
    </div>

    <div class="filters">
      <label>Type <select id="f-cat"></select></label>
      <label>Size <select id="f-size"></select></label>
      <label>Sort by
        <select id="f-sort">
          <option value="new">Newest</option>
          <option value="low">Price, low to high</option>
          <option value="high">Price, high to low</option>
        </select>
      </label>
      <label>Show
        <select id="f-stock">
          <option value="stock">In stock</option>
          <option value="all">In stock and sold</option>
        </select>
      </label>
      <p class="count" id="count"></p>
    </div>

    <ul class="grid" id="grid"></ul>
    <div class="empty" id="empty" hidden>
      <h2>No pieces match</h2>
      <p>Try a different size or type, or check back after the next batch arrives.</p>
    </div>
    <div style="height: var(--s5)"></div>
  </main>

  <div id="site-footer"></div>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
