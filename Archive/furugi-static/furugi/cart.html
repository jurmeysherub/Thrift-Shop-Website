<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart | Furugi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">
  <div id="site-header"></div>

  <main class="wrap">
    <div class="page-title"><h1>Your cart</h1></div>

    <div class="empty" id="cart-empty" hidden>
      <h2>Nothing on your rail yet</h2>
      <p>Pick a piece you like and add it here. <a class="link-plain" href="shop.html">Browse the shop</a>.</p>
    </div>

    <div class="cart-layout" id="cart-body">
      <div>
        <ul class="cart-list" id="cart-list"></ul>
        <p class="total"><span>Total</span><span id="total"></span></p>
        <p class="note" style="margin-top:.5rem">Delivery cost is confirmed on WhatsApp.</p>
      </div>

      <form class="form" id="order-form">
        <h2>Send your order</h2>
        <label>Name <input type="text" name="name" required autocomplete="name"></label>
        <label>Phone number <input type="tel" name="phone" required autocomplete="tel"></label>
        <label>Delivery
          <select name="delivery">
            <option>Deliver in Thimphu</option>
            <option>Pick up</option>
            <option>Courier to another dzongkhag</option>
          </select>
        </label>
        <label>Address or landmark <textarea name="address" rows="3"></textarea></label>
        <label>Payment
          <select name="payment">
            <option>Cash on delivery</option>
            <option>mBoB</option>
            <option>mPay</option>
            <option>Bank transfer</option>
          </select>
        </label>
        <button class="btn" type="submit">Send order on WhatsApp</button>
        <p class="note">Each piece is one of one. We confirm availability before you pay.</p>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
